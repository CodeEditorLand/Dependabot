                  cache-dependency-path: ./npm_and_yarn/helpers/test/npm6/fixtures/conflicting-dependency-parser/nested/pnpm-lock.yaml

            - run: pnpm install
              working-directory: ./npm_and_yarn/helpers/test/npm6/fixtures/conflicting-dependency-parser/nested

            - run: pnpm run test
              working-directory: ./npm_and_yarn/helpers/test/npm6/fixtures/conflicting-dependency-parser/nested

